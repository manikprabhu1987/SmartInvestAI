spring.application.name=smart-invest-ai


# =========================
# Database
# =========================

spring.datasource.url: jdbc:mysql://localhost:3306/smartinvest
spring.datasource.username: root
spring.datasource.password: root@123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =========================
# JPA
# =========================

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# =========================
# Flyway
# =========================

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# =========================
# JWT
# =========================

jwt.secret=martinvest-super-secret-key-for-development-only
jwt.issuer=smart-invest-ai
jwt.audience=smart-invest-client

# =========================
# Server
# =========================

server.port=8080