openapi: 3.1.0
info:
  title: SmartInvest AI Authentication and Watchlist API
  version: 1.0.0
  description: REST contract for searching the stock catalog and managing the authenticated user's watchlist.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
tags:
  - name: Authentication
  - name: Stocks
  - name: Watchlist
paths:
  /auth/register:
    post:
      tags: [Authentication]
      operationId: registerUser
      summary: Register an account
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Account created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "400":
          description: Registration details are invalid.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "409":
          description: Email is already registered.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "503":
          description: Account persistence is unavailable.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
  /auth/login:
    post:
      tags: [Authentication]
      operationId: loginUser
      summary: Authenticate and issue a JWT
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Credentials accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthTokenResponse"
        "400":
          description: Login details are malformed.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "401":
          description: Credentials are invalid.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "503":
          description: Account persistence is unavailable.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
  /auth/logout:
    post:
      tags: [Authentication]
      operationId: logoutUser
      summary: Revoke the current JWT
      responses:
        "204":
          description: Current token revoked.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          description: Token revocation storage is unavailable.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
  /stocks/search:
    get:
      tags: [Stocks]
      operationId: searchStocks
      summary: Search the active MySQL stock catalog
      parameters:
        - name: q
          in: query
          required: true
          description: Case-insensitive symbol or company-name fragment.
          schema:
            type: string
            minLength: 1
            maxLength: 100
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        "200":
          description: Matching stocks; an empty items array means no matches.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockSearchPage"
        "400":
          description: Query is blank, malformed, too long, or pagination is invalid.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          description: Stock catalog is unavailable.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
  /watchlist:
    get:
      tags: [Watchlist]
      operationId: getWatchlist
      summary: Get the authenticated user's watchlist
      responses:
        "200":
          description: Watchlist entries, newest first; empty when none exist.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/WatchlistEntry"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          description: Watchlist persistence is unavailable.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
    post:
      tags: [Watchlist]
      operationId: addWatchlistStock
      summary: Add a supported stock to the authenticated user's watchlist
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddWatchlistStockRequest"
      responses:
        "201":
          description: Stock added.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WatchlistEntry"
        "400":
          description: Symbol is blank or malformed.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Symbol is not present as an active stock in the catalog.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "409":
          description: Stock is already in this user's watchlist.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "503":
          description: Stock catalog or persistence is unavailable.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
  /watchlist/{symbol}:
    delete:
      tags: [Watchlist]
      operationId: removeWatchlistStock
      summary: Remove a stock from the authenticated user's watchlist
      parameters:
        - name: symbol
          in: path
          required: true
          description: Stock symbol; matched case-insensitively after normalization.
          schema:
            type: string
            minLength: 1
            maxLength: 32
      responses:
        "200":
          description: Stock removed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RemoveWatchlistStockResponse"
        "400":
          description: Symbol is blank or malformed.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Stock is not in the authenticated user's watchlist.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "503":
          description: Persistence is unavailable.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    Unauthorized:
      description: Authentication is missing or invalid.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ApiProblem"
  schemas:
    RegisterRequest:
      type: object
      additionalProperties: false
      required: [name, email, password]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        email:
          type: string
          format: email
          maxLength: 320
        password:
          type: string
          format: password
          minLength: 12
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 320
        password:
          type: string
          format: password
    UserProfile:
      type: object
      required: [id, name, email]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        email:
          type: string
          format: email
    AuthTokenResponse:
      type: object
      required: [accessToken, tokenType, expiresAt, user]
      properties:
        accessToken:
          type: string
          description: Signed JWT returned for authentication.
        tokenType:
          type: string
          description: Use the bearer authentication scheme.
        expiresAt:
          type: string
          format: date-time
        user:
          $ref: "#/components/schemas/UserProfile"
    StockSummary:
      type: object
      required: [symbol, companyName, active]
      properties:
        symbol:
          type: string
          maxLength: 32
          description: Canonical uppercase symbol.
        companyName:
          type: string
        exchangeCode:
          type: [string, "null"]
        active:
          type: boolean
    StockSearchPage:
      type: object
      required: [items, page, size, hasNext]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/StockSummary"
        page:
          type: integer
        size:
          type: integer
        hasNext:
          type: boolean
    WatchlistEntry:
      type: object
      required: [id, stock, addedAt]
      properties:
        id:
          type: integer
          format: int64
        stock:
          $ref: "#/components/schemas/StockSummary"
        addedAt:
          type: string
          format: date-time
    AddWatchlistStockRequest:
      type: object
      additionalProperties: false
      required: [symbol]
      properties:
        symbol:
          type: string
          minLength: 1
          maxLength: 32
          description: Symbol is trimmed and normalized to uppercase before lookup.
    RemoveWatchlistStockResponse:
      type: object
      required: [symbol, removed]
      properties:
        symbol:
          type: string
        removed:
          type: boolean
          const: true
    ApiProblem:
      type: object
      required: [type, title, status, detail, code]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
          description: Safe, user-readable explanation of the failure.
        code:
          type: string
          enum:
            - EMAIL_ALREADY_REGISTERED
            - INVALID_CREDENTIALS
            - VALIDATION_ERROR
            - TOKEN_REVOKED
            - INVALID_SYMBOL
            - INVALID_SEARCH_QUERY
            - STOCK_NOT_FOUND
            - WATCHLIST_DUPLICATE
            - WATCHLIST_ENTRY_NOT_FOUND
            - UNAUTHENTICATED
            - CATALOG_UNAVAILABLE
            - PERSISTENCE_UNAVAILABLE
            - CONFLICT
