spring.application.name=smart-invest-ai
spring.datasource.url=${DB_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:smartinvest}}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

jwt.secret=${JWT_SECRET}
jwt.issuer=${JWT_ISSUER}
jwt.audience=${JWT_AUDIENCE}
jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:15}

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
server.error.include-message=never
server.error.include-stacktrace=never
server.port=${SERVER_PORT:8080}
twelvedata.base-url=${TWELVE_DATA_API_BASE_URL:https://api.twelvedata.com}
twelvedata.api-key=${TWELVE_DATA_API_KEY:}